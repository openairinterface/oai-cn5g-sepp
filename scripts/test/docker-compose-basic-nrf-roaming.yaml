services:
    oai-sepp-A:
        container_name: "sepp.5gc.mnc22.mcc208.3gppnetwork.org"
        image: oai-sepp:latest
        expose:
            - 443/tcp
            - 80/tcp
            - 8080/tcp
        environment:
            - SSLKEYLOGFILE=/openair-sepp/certs/sslkeylog.log
        volumes:
            - ./conf/roaming_config_partnerA.yaml:/openair-sepp/etc/config.yaml
            - ./conf/certs:/openair-sepp/certs/
        cap_add:
            - NET_ADMIN
            - SYS_ADMIN
        cap_drop:
            - ALL
        privileged: true
        depends_on:
          - oai-nrf-A
        networks:
            public_netA:
                ipv4_address: 192.168.71.132
            public_net_roaming:
                ipv4_address: 192.168.72.111
    oai-nrf-A:
        container_name: "nrf.5gc.mnc22.mcc208.3gppnetwork.org"
        image: oai-nrf:test
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./conf/roaming_config_partnerA.yaml:/openair-nrf/etc/config.yaml
        networks:
            public_netA:
                ipv4_address: 192.168.71.136
######################################################################################
#                             Roaming Partner B                                      #
######################################################################################
    mysql-B:
        container_name: "mysql-B"
        image: mysql:9.6.0
        volumes:
            - ./database/oai_roaming_db.sql:/docker-entrypoint-initdb.d/oai_db.sql
            - ./healthscripts/mysql-healthcheck2.sh:/tmp/mysql-healthcheck.sh
        environment:
            - TZ=Europe/Paris
            - MYSQL_DATABASE=oai_db
            - MYSQL_USER=test
            - MYSQL_PASSWORD=test
            - MYSQL_ROOT_PASSWORD=linux
        healthcheck:
            test: /bin/bash -c "/tmp/mysql-healthcheck.sh"
            interval: 10s
            timeout: 5s
            retries: 30
        networks:
            public_netB:
              ipv4_address: 192.168.73.131

    oai-nrf-B:
        container_name: "nrf.5gc.mnc10.mcc262.3gppnetwork.org"
        #image: oaisoftwarealliance/oai-nrf:develop
        image: oai-nrf:test
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./conf/roaming_config_partnerB.yaml:/openair-nrf/etc/config.yaml
            - ./conf/certs:/openair-sepp/certs/
        environment:
            - TZ=Europe/Paris
        networks:
            public_netB:
              ipv4_address: 192.168.73.132

    oai-ausf-B:
        container_name: "ausf.5gc.mnc10.mcc262.3gppnetwork.org"
        image: oai-ausf:latest
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./conf/roaming_config_partnerB.yaml:/openair-ausf/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        depends_on:
            - oai-nrf-B
        networks:
            public_netB:
              ipv4_address: 192.168.73.133

    oai-udr-B:
        container_name: "udr.5gc.mnc10.mcc262.3gppnetwork.org"
        image: oai-udr:latest
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./conf/roaming_config_partnerB.yaml:/openair-udr/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        depends_on:
            - mysql-B
            - oai-nrf-B
        networks:
            public_netB:
              ipv4_address: 192.168.73.134

    oai-udm-B:
        container_name: "udm.5gc.mnc10.mcc262.3gppnetwork.org"
        image: oai-udm:latest
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./conf/roaming_config_partnerB.yaml:/openair-udm/etc/config.yaml
        environment:

            - TZ=Europe/Paris
        depends_on:
            - oai-nrf-B
        networks:
            public_netB:
              ipv4_address: 192.168.73.135


    oai-sepp-B:
        container_name: "sepp.5gc.mnc10.mcc262.3gppnetwork.org"
        image: oai-sepp:latest
        expose:
            - 443/tcp
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./conf/roaming_config_partnerB.yaml:/openair-sepp/etc/config.yaml
            - ./conf/certs:/openair-sepp/certs/
        cap_add:
            - NET_ADMIN
            - SYS_ADMIN
        cap_drop:
            - ALL
        privileged: true
        depends_on:
          - oai-nrf-B
        networks:
            public_netB:
                ipv4_address: 192.168.73.136
            public_net_roaming:
                ipv4_address: 192.168.72.222
networks:
    public_netA:
        driver: bridge
        name: oai-public-netA
        ipam:
            config:
                - subnet: 192.168.71.0/24
        driver_opts:
            com.docker.network.bridge.name: "cn5g-partnerA"
    public_net_roaming:
        name: oai-public-roam
        ipam:
            config:
                - subnet: 192.168.72.0/24
        driver_opts:
            com.docker.network.bridge.name: "cn5g-roam"
    public_netB:
        driver: bridge
        name: oai-public-netB
        ipam:
            config:
                - subnet: 192.168.73.0/24
        driver_opts:
            com.docker.network.bridge.name: "cn5g-partnerB"
